<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Front matter visual preview</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e6edf3;background:#0d1117}
      body{margin:0;padding:24px}.eyebrow{color:#79c0ff;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
      h1{font-size:28px;margin:8px 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
      .card{border:1px solid #30363d;border-radius:10px;padding:16px;background:#161b22}.card strong{display:block;margin-bottom:8px}
      .swatch{height:62px;border-radius:8px;margin-bottom:12px}.black{background:#000}.white{background:#fff}.moon{background:linear-gradient(135deg,#182848,#4b6cb7)}.sky{background:linear-gradient(135deg,#e0f7fa,#81d4fa)}.solarized{background:#fdf6e3}.night{background:linear-gradient(135deg,#020024,#090979,#00d4ff)}
      code{color:#a5d6ff;background:#0d1117;border-radius:5px;padding:3px 6px}.transition{display:flex;align-items:center;gap:10px;margin:10px 0;color:#c9d1d9}.dot{width:18px;height:18px;border-radius:50%;background:#58a6ff;box-shadow:0 0 0 5px #1f6feb33}
      @media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div class="eyebrow">Visual guide</div><h1>Theme, transition, and layout values</h1>
    <div class="grid">
      <div class="card"><div class="swatch black"></div><strong>black</strong><code>theme: black</code></div>
      <div class="card"><div class="swatch white"></div><strong>white</strong><code>theme: white</code></div>
      <div class="card"><div class="swatch moon"></div><strong>moon</strong><code>theme: moon</code></div>
      <div class="card"><div class="swatch sky"></div><strong>sky</strong><code>theme: sky</code></div>
      <div class="card"><div class="swatch solarized"></div><strong>solarized</strong><code>theme: solarized</code></div>
      <div class="card"><div class="swatch night"></div><strong>night</strong><code>theme: night</code></div>
    </div>
    <div class="card" style="margin-top:12px"><strong>Transitions</strong><div class="transition"><span class="dot"></span><code>none</code> — instant</div><div class="transition"><span class="dot"></span><code>fade</code> — crossfade</div><div class="transition"><span class="dot"></span><code>slide</code> — horizontal slide</div><div class="transition"><span class="dot"></span><code>convex / concave / zoom</code> — 3D or scale transitions</div></div>
  </body>
</html>
