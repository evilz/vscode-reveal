<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VS Code Reveal example</title>
    <link rel="stylesheet" href="../libs/reveal.js/6.0.1/reveal.css" />
    <link rel="stylesheet" href="../libs/reveal.js/6.0.1/theme/black.css" />
    <style>html,body{height:100%;margin:0;background:#0d1117}.reveal{height:100%}</style>
  </head>
  <body>
    <div class="reveal"><div class="slides">
      <section><h1>Markdown → slides</h1><p class="fragment">Live preview in VS Code</p><p class="fragment highlight-red">Export when ready</p></section>
      <section><h2>Small source, polished result</h2><pre><code># Your idea — one slide at a time</code></pre></section>
    </div></div>
    <script src="../libs/reveal.js/6.0.1/reveal.js"></script>
    <script>Reveal.initialize({hash:true,progress:true,controls:true,transition:'slide'});</script>
  </body>
</html>
